<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あなたの人生と地球の進化年表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF9F6;
    --bg-soft:#F1EEE6;
    --card:#FFFFFF;
    --navy:#0B1F3A;
    --navy-deep:#050B14;
    --navy-soft:#16294A;
    --gold:#AD8A34;
    --gold-light:#D9B96A;
    --gold-glow:#F0CE83;
    --text:#16202E;
    --text-muted:#5B6472;
    --border:#E6E1D4;
    --radius:14px;
    --serif:'Noto Serif JP', serif;
    --sans:'Noto Sans JP', sans-serif;
    --disp:'Cormorant Garamond', 'Noto Serif JP', serif;
  }
  [data-theme="dark"]{
    --bg:#070B14;
    --bg-soft:#0C1220;
    --card:#0F1830;
    --navy:#CBD5E6;
    --navy-deep:#E8ECF5;
    --navy-soft:#1A2740;
    --text:#E7E6DE;
    --text-muted:#9BA3B4;
    --border:#22304C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.7;
    transition:background .4s ease, color .4s ease;
    min-height:100vh;
  }
  ::selection{background:var(--gold-glow); color:var(--navy-deep);}

  .container{max-width:920px; margin:0 auto; padding:0 24px;}
  button{font-family:var(--sans); cursor:pointer; border:none;}
  input,select{font-family:var(--sans);}
  a{color:inherit;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

  .hero{
    position:relative;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% -10%, #1B3560 0%, transparent 55%),
      radial-gradient(ellipse at 80% 100%, #12203C 0%, transparent 50%),
      linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 70%, var(--navy-soft) 100%);
    color:#F3EFE4;
    overflow:hidden;
    padding:80px 24px;
  }
  .stars{position:absolute; inset:0; pointer-events:none;}
  .stars span{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background:#fff; opacity:.5;
    animation:twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15;} 50%{opacity:.85;}}
  @media (prefers-reduced-motion:reduce){
    .stars span{animation:none; opacity:.4;}
  }
  .hero-eyebrow{
    font-family:var(--disp); font-style:italic; letter-spacing:.12em;
    color:var(--gold-light); font-size:15px; text-transform:uppercase;
    margin-bottom:22px; position:relative; z-index:1;
  }
  .hero h1{
    font-family:var(--serif); font-weight:600;
    font-size:clamp(28px, 5vw, 46px);
    text-align:center; max-width:14ch; line-height:1.4;
    position:relative; z-index:1;
  }
  .hero p.sub{
    margin-top:20px; color:#B9C2D6; text-align:center;
    max-width:38ch; font-size:15.5px; position:relative; z-index:1;
  }
  .hero-form{
    margin-top:48px; position:relative; z-index:1;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(217,185,106,.28);
    backdrop-filter:blur(6px);
    border-radius:18px;
    padding:32px 30px;
    width:100%; max-width:400px;
    display:flex; flex-direction:column; gap:18px;
  }
  .hero-form label{font-size:13px; color:var(--gold-light); letter-spacing:.04em;}
  .hero-form input[type="date"]{
    width:100%; padding:13px 14px; margin-top:8px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18);
    border-radius:9px; color:#F3EFE4; font-size:16px;
  }
  .hero-form input[type="text"]{
    width:100%; padding:13px 14px; margin-top:8px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18);
    border-radius:9px; color:#F3EFE4; font-size:15px;
  }
  .hero-form input::placeholder{color:#8590A6;}
  .btn-gold{
    margin-top:6px; padding:15px 20px; border-radius:9px;
    background:linear-gradient(135deg, var(--gold-light), var(--gold));
    color:#1A1204; font-weight:600; font-size:15.5px; letter-spacing:.03em;
    transition:transform .2s ease, box-shadow .2s ease;
    box-shadow:0 8px 24px -8px rgba(173,138,52,.6);
  }
  .btn-gold:hover{transform:translateY(-1px); box-shadow:0 10px 30px -6px rgba(173,138,52,.75);}
  .btn-gold:disabled{opacity:.55; cursor:not-allowed; transform:none;}
  .hero-note{
    margin-top:14px; font-size:12px; color:#7B87A0; text-align:center; position:relative; z-index:1;
  }

  .app-header{
    position:sticky; top:0; z-index:40;
    background:var(--bg); border-bottom:1px solid var(--border);
  }
  .app-header-inner{
    max-width:920px; margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{width:9px; height:9px; border-radius:50%; background:var(--gold); display:inline-block;}
  .brand span{font-family:var(--serif); font-weight:600; font-size:15px;}
  .header-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .icon-btn{
    padding:8px 13px; border-radius:8px; background:transparent; border:1px solid var(--border);
    color:var(--text); font-size:13px; display:flex; align-items:center; gap:6px;
  }
  .icon-btn:hover{border-color:var(--gold);}

  .stats-bar{
    background:linear-gradient(135deg, var(--navy-deep), var(--navy-soft));
    color:#EDE9DC; padding:34px 24px; margin-top:0;
  }
  .stats-title{
    font-family:var(--serif); font-size:14px; letter-spacing:.08em; color:var(--gold-light);
    text-align:center; margin-bottom:20px;
  }
  .stats-grid{
    max-width:920px; margin:0 auto;
    display:grid; grid-template-columns:repeat(6,1fr); gap:10px;
  }
  @media (max-width:760px){ .stats-grid{grid-template-columns:repeat(3,1fr);} }
  .stat{text-align:center;}
  .stat .num{font-family:var(--disp); font-weight:600; font-size:clamp(18px,3vw,26px); color:#fff; font-variant-numeric:tabular-nums;}
  .stat .lbl{font-size:11px; color:#9BAAC4; margin-top:4px; letter-spacing:.03em;}

  .controls{
    max-width:920px; margin:28px auto 0; padding:0 24px;
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  .controls input[type="search"]{
    flex:1; min-width:180px; padding:11px 14px; border-radius:9px;
    border:1px solid var(--border); background:var(--card); color:var(--text); font-size:14px;
  }
  .controls select{
    padding:11px 12px; border-radius:9px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:14px;
  }
  .toggle-group{display:flex; border:1px solid var(--border); border-radius:9px; overflow:hidden;}
  .toggle-group button{
    padding:10px 14px; background:var(--card); color:var(--text-muted); font-size:13px;
  }
  .toggle-group button.active{background:var(--navy); color:#fff;}

  .timeline-wrap{max-width:920px; margin:0 auto; padding:50px 24px 20px; position:relative;}
  .spine{
    position:absolute; left:50%; top:50px; bottom:20px; width:2px; transform:translateX(-50%);
    background:linear-gradient(180deg, var(--gold-light), var(--border) 92%);
  }
  @media (max-width:680px){ .spine{left:20px;} }

  .year-block{position:relative; padding:0 0 56px;}
  .year-node{
    position:relative; z-index:2; display:flex; justify-content:center; margin-bottom:22px;
  }
  @media (max-width:680px){ .year-node{justify-content:flex-start; padding-left:2px;} }
  .year-badge{
    background:var(--navy); color:#fff; border:2px solid var(--gold-light);
    border-radius:999px; padding:10px 22px; display:flex; align-items:center; gap:12px;
    box-shadow:0 4px 18px -6px rgba(11,31,58,.4);
  }
  .year-badge .yr{font-family:var(--disp); font-weight:600; font-size:22px;}
  .year-badge .age{font-size:12px; color:var(--gold-light); border-left:1px solid rgba(255,255,255,.25); padding-left:12px;}
  .year-node.current .year-badge{box-shadow:0 0 0 5px rgba(217,185,106,.22), 0 4px 18px -6px rgba(11,31,58,.4); animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(217,185,106,.18);} 50%{box-shadow:0 0 0 9px rgba(217,185,106,.05);}}

  .stars-row{display:flex; gap:3px; justify-content:center; margin:-6px 0 24px;}
  .stars-row .star{color:var(--border); font-size:15px;}
  .stars-row .star.on{color:var(--gold);}

  .cols{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:680px){ .cols{grid-template-columns:1fr;} }
  .col h4{
    font-family:var(--serif); font-size:13.5px; font-weight:600; margin-bottom:10px;
    color:var(--text-muted); display:flex; align-items:center; gap:6px;
  }
  .event-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:10px;
  }
  .event-card .cat{
    display:inline-block; font-size:11px; color:var(--gold); background:rgba(173,138,52,.1);
    padding:2px 9px; border-radius:999px; margin-bottom:7px; letter-spacing:.02em;
  }
  .event-card h5{font-size:14.5px; font-weight:600; margin-bottom:5px; line-height:1.5;}
  .event-card p{font-size:13px; color:var(--text-muted); line-height:1.65;}
  .event-card .impact{
    margin-top:9px; padding-top:9px; border-top:1px dashed var(--border);
    font-size:12px; color:var(--text-muted);
  }
  .event-card .impact b{color:var(--gold); font-weight:600; display:block; margin-bottom:3px; font-size:11px;}

  .ai-comment{
    margin-top:16px; background:var(--bg-soft); border-left:3px solid var(--gold);
    border-radius:0 10px 10px 0; padding:14px 18px; font-size:13.5px; color:var(--text);
  }
  .ai-comment b{color:var(--gold); font-size:11px; display:block; margin-bottom:5px; letter-spacing:.03em;}

  .star-reason{font-size:11.5px; color:var(--text-muted); text-align:center; margin-top:-18px; margin-bottom:22px;}

  .skeleton-year{padding:26px 0 56px; text-align:center;}
  .skel-badge{
    display:inline-block; width:120px; height:38px; border-radius:999px; margin-bottom:20px;
    background:linear-gradient(90deg, var(--bg-soft) 25%, var(--border) 37%, var(--bg-soft) 63%);
    background-size:400% 100%; animation:shimmer 1.6s ease-in-out infinite;
  }
  .skel-card{
    height:74px; border-radius:var(--radius); margin-bottom:10px;
    background:linear-gradient(90deg, var(--bg-soft) 25%, var(--border) 37%, var(--bg-soft) 63%);
    background-size:400% 100%; animation:shimmer 1.6s ease-in-out infinite;
  }
  @keyframes shimmer{0%{background-position:100% 0;} 100%{background-position:0 0;}}

  .summary-section{
    background:linear-gradient(160deg, var(--navy-deep), var(--navy) 60%, var(--navy-soft));
    color:#EDE9DC; padding:70px 24px; margin-top:20px;
  }
  .summary-inner{max-width:720px; margin:0 auto;}
  .summary-eyebrow{
    font-family:var(--disp); font-style:italic; color:var(--gold-light); text-align:center;
    letter-spacing:.1em; margin-bottom:14px; font-size:15px;
  }
  .summary-inner h2{
    font-family:var(--serif); text-align:center; font-size:clamp(22px,3.4vw,30px);
    margin-bottom:28px; font-weight:600;
  }
  .summary-text{font-size:15px; line-height:2.05; color:#D7DBE6; white-space:pre-wrap;}
  .summary-text::first-letter{font-size:2.6em; font-family:var(--disp); color:var(--gold-light); float:left; line-height:.8; margin-right:8px; margin-top:6px;}

  .export-bar{
    max-width:920px; margin:0 auto; padding:36px 24px 90px;
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
  }
  .export-bar button{
    padding:11px 20px; border-radius:9px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:13.5px; display:flex; gap:7px; align-items:center;
  }
  .export-bar button:hover{border-color:var(--gold); color:var(--gold);}

  .loading-status{
    text-align:center; padding:16px; font-size:13px; color:var(--text-muted);
  }
  .loading-status .dot{
    display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--gold);
    margin-right:8px; animation:blink 1.2s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:.25;} 50%{opacity:1;}}

  .error-box{
    max-width:600px; margin:20px auto; padding:16px 18px; border-radius:10px;
    background:#FDEDEC; border:1px solid #F1B4AE; color:#8A2E24; font-size:13.5px;
  }
  [data-theme="dark"] .error-box{background:#2A1414; border-color:#5C2B24; color:#F0A79C;}

  @media print{
    .app-header, .controls, .export-bar, .stars, .hero-note, .icon-btn{display:none !important;}
    .hero{min-height:auto; page-break-after:always;}
    .year-block{page-break-inside:avoid; break-inside:avoid;}
    body{background:#fff; color:#111;}
    .stats-bar, .summary-section{background:#0B1F3A !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }

  .hidden{display:none !important;}
</style>
</head>
<body>

<section class="hero" id="hero">
  <div class="stars" id="stars"></div>
  <div class="hero-eyebrow">Life &amp; Earth Evolution Timeline</div>
  <h1>あなたの人生と<br>地球の進化年表</h1>
  <p class="sub">あなたが生きてきた時代、人類と地球はどのように<br>進化してきたのでしょう。</p>

  <form class="hero-form" id="birthForm">
    <div>
      <label for="birthdate">生年月日</label>
      <input type="date" id="birthdate" min="1920-01-01" required>
    </div>
    <button type="submit" class="btn-gold" id="generateBtn">年表を作成</button>
  </form>
  <p class="hero-note">生年月日を入力すると、その日から今日までの年表がすぐに表示されます。</p>
</section>

<div id="app" class="hidden">

  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand"><span class="mark"></span><span>人生と地球の進化年表</span></div>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggle">🌙 ダーク</button>
        <button class="icon-btn" id="printBtn">🖨 印刷 / PDF保存</button>
        <button class="icon-btn" id="restartBtn">↺ 最初から</button>
      </div>
    </div>
  </header>

  <section class="stats-bar">
    <div class="stats-title">LIFE  IN  NUMBERS</div>
    <div class="stats-grid" id="statsGrid"></div>
  </section>

  <div class="controls">
    <input type="search" id="searchInput" placeholder="キーワードで検索（例：AI、宇宙、医療）">
    <select id="categoryFilter">
      <option value="">すべてのカテゴリ</option>
    </select>
    <div class="toggle-group" id="regionToggle">
      <button data-region="all" class="active">日本＋世界</button>
      <button data-region="jp">日本のみ</button>
      <button data-region="world">世界のみ</button>
    </div>
    <select id="jumpYear"><option value="">年代へジャンプ</option></select>
  </div>

  <main class="timeline-wrap" id="timelineWrap">
    <div class="spine"></div>
  </main>

  <section class="summary-section hidden" id="summarySection">
    <div class="summary-inner">
      <div class="summary-eyebrow">Your Chapter in History</div>
      <h2>あなたが生きた時代</h2>
      <div class="summary-text" id="summaryText"></div>
    </div>
  </section>

  <div class="export-bar">
    <button id="exportJson">⇩ JSON書き出し</button>
    <button id="exportCsv">⇩ CSV書き出し</button>
    <button id="saveHistory">☆ この年表を保存</button>
    <button id="loadHistory">🕘 保存履歴を開く</button>
  </div>
</div>

<script>
// 静的年表データ (1920-2025)
// jp/world: 3件ずつ。category は 科学/医学/IT/AI/宇宙/環境/インフラ/文化/スポーツ/経済/平和 のいずれか
const TIMELINE_DATA = {
1920:{jp:[
  {title:"日本、国際連盟の常任理事国に",category:"平和",desc:"第一次大戦後に設立された国際連盟に、日本は常任理事国として参加した。",impact:"国際協調の枠組みに参加した経験は、戦後の国連加盟や外交姿勢の原点となった。"},
  {title:"内務省衛生局が感染症対策を強化",category:"医学",desc:"スペイン風邪の流行を経て、日本国内で公衆衛生行政の整備が進められた。",impact:"その後の保健所制度や感染症法制の基盤となった。"},
  {title:"東京帝国大学で航空研究所が構想",category:"科学",desc:"航空技術の研究体制づくりが始まり、後の航空機産業の礎となった。",impact:"戦後の航空宇宙研究、JAXAへとつながる技術系譜の出発点となった。"},
  {title:"大学令に基づき私立大学が正式に昇格",category:"教育",desc:"慶應義塾大学・早稲田大学など私立校が正式な大学として認可された。",impact:"日本の高等教育の担い手が官立大学以外にも広がる転機となった。"},
  {title:"帝国美術院美術展覧会（帝展）が本格的に定着",category:"文化",desc:"官設の美術展覧会が芸術家の発表の場として広く定着した。",impact:"日展として現在まで続く日本美術界の中心的な展覧会の基盤となった。"},
  {title:"熊谷一弥がアントワープ五輪テニスで日本人初のメダル",category:"スポーツ",desc:"熊谷一弥がテニスシングルスで銀メダルを獲得した。",impact:"日本のオリンピック参加の歴史における最初の輝かしい実績となった。"},
  {title:"日本初の国勢調査を実施",category:"経済",desc:"全国民を対象とした近代的な人口統計調査が初めて行われた。",impact:"以後100年以上続く国の基礎統計として政策立案を支え続けている。"}
],world:[
  {title:"国際連盟が発足",category:"平和",desc:"世界初の恒久的な国際平和機構として国際連盟がジュネーブで発足した。",impact:"理念は国際連合に引き継がれ、現在の国際協調の原型となっている。"},
  {title:"アインシュタインの相対性理論が観測で裏付け",category:"科学",desc:"前年の日食観測データの検証が進み、一般相対性理論への支持が広がった。",impact:"GPSなど現代の測位技術は相対性理論の補正なしには成立しない。"},
  {title:"KDKA局による世界初の商業ラジオ放送が始まる",category:"IT",desc:"アメリカのピッツバーグで定期的な商業ラジオ放送が開始された。",impact:"以後のマスメディア・放送産業全体の出発点となった。"},
  {title:"ゴダードによる液体燃料ロケットの理論研究が進む",category:"宇宙",desc:"ロバート・ゴダードが液体燃料ロケットの理論的基礎を構築した。",impact:"後の宇宙開発・ロケット技術発展の理論的な出発点となった。"},
  {title:"アントワープ五輪が開催、国際スポーツの祭典が復活",category:"スポーツ",desc:"第一次世界大戦後初めてのオリンピックが戦後復興の象徴として開催された。",impact:"国際的なスポーツ交流の枠組みが戦後の世界で再び動き出した。"}
],aiComment:"戦争の惨禍を経て国際協調の枠組みが生まれ、同時に科学・情報・スポーツの各分野で人類が新たな一歩を踏み出した年でした。",stars:3,starReason:"国際協調の礎が築かれた年"},

1921:{jp:[

<script>
(function(){
  "use strict";

  document.getElementById('birthdate').max = new Date().toISOString().slice(0,10);

  const starsEl = document.getElementById('stars');
  for(let i=0;i<70;i++){
    const s=document.createElement('span');
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.animationDelay=(Math.random()*4)+'s';
    s.style.width=s.style.height=(Math.random()<0.15?'3px':'1.5px');
    starsEl.appendChild(s);
  }

  let state = {
    birthDate: null,
    years: {},
    currentYear: new Date().getFullYear(),
    region: 'all',
    category: '',
    search: '',
    theme: 'light'
  };

  const CATEGORY_ICONS = {
    "科学":"🧬","医学":"🏥","医療":"🏥","IT":"💻","AI":"🤖","教育":"📚",
    "宇宙":"🚀","環境":"🌱","インフラ":"🏗️","文化":"🎨","スポーツ":"🏅",
    "経済":"💰","平和":"🤝","平和・人権":"🤝","人権":"🤝"
  };

  function updateStats(){
    if(!state.birthDate) return;
    const now = new Date();
    const birth = state.birthDate;
    const diffMs = now - birth;
    const ageYears = Math.floor((now - birth) / (365.2425*86400000));
    const days = Math.floor(diffMs/86400000);
    const weeks = Math.floor(days/7);
    const months = (now.getFullYear()-birth.getFullYear())*12 + (now.getMonth()-birth.getMonth());
    const hours = Math.floor(diffMs/3600000);
    const secs = Math.floor(diffMs/1000);
    const grid = document.getElementById('statsGrid');
    const items = [
      [ageYears+' 歳','現在年齢'],
      [days.toLocaleString(),'生後日数'],
      [weeks.toLocaleString(),'週数'],
      [months.toLocaleString(),'月数'],
      [hours.toLocaleString(),'時間'],
      [secs.toLocaleString(),'秒']
    ];
    grid.innerHTML = items.map(function(pair){
      return '<div class="stat"><div class="num">'+pair[0]+'</div><div class="lbl">'+pair[1]+'</div></div>';
    }).join('');
  }
  setInterval(updateStats, 1000);

  function ageInYear(y){ return y - state.birthDate.getFullYear(); }

  function passesFilter(ev){
    if(state.category && ev.category !== state.category) return false;
    if(state.search){
      const q = state.search.toLowerCase();
      if(!(ev.title.toLowerCase().includes(q) || ev.desc.toLowerCase().includes(q))) return false;
    }
    return true;
  }

  function renderEventCard(ev){
    const icon = CATEGORY_ICONS[ev.category] || '✦';
    return '<div class="event-card">'+
      '<span class="cat">'+icon+' '+ev.category+'</span>'+
      '<h5>'+ev.title+'</h5>'+
      '<p>'+ev.desc+'</p>'+
      '<div class="impact"><b>現在への影響</b>'+ev.impact+'</div>'+
    '</div>';
  }

  function renderYearBlock(y){
    const d = state.years[y];
    const isCurrent = y === state.currentYear;
    if(!d){
      return '<div class="year-block" id="year-'+y+'">'+
        '<div class="year-node '+(isCurrent?'current':'')+'">'+
          '<div class="year-badge"><span class="yr">'+y+'</span><span class="age">'+ageInYear(y)+'歳</span></div>'+
        '</div>'+
        '<p style="text-align:center;color:var(--text-muted);font-size:13px;">この年のデータは準備中です。</p>'+
      '</div>';
    }
    const jpEvents = d.jp.filter(passesFilter);
    const worldEvents = d.world.filter(passesFilter);
    if(state.search || state.category){
      if(jpEvents.length===0 && worldEvents.length===0) return '';
    }
    const showJp = state.region!=='world';
    const showWorld = state.region!=='jp';
    let stars = '';
    for(let i=0;i<5;i++) stars += '<span class="star '+(i<d.stars?'on':'')+'">★</span>';

    let cols = '<div class="cols">';
    if(showJp) cols += '<div class="col"><h4>🇯🇵 日本の進化</h4>'+(jpEvents.length?jpEvents:d.jp).map(renderEventCard).join('')+'</div>';
    if(showWorld) cols += '<div class="col"><h4>🌍 世界の進化</h4>'+(worldEvents.length?worldEvents:d.world).map(renderEventCard).join('')+'</div>';
    cols += '</div>';

    return '<div class="year-block" id="year-'+y+'">'+
      '<div class="year-node '+(isCurrent?'current':'')+'">'+
        '<div class="year-badge"><span class="yr">'+y+'</span><span class="age">'+ageInYear(y)+'歳</span></div>'+
      '</div>'+
      '<div class="stars-row">'+stars+'</div>'+
      '<div class="star-reason">'+(d.starReason||'')+'</div>'+
      cols+
      '<div class="ai-comment"><b>この一年が人類へ与えた影響</b>'+d.aiComment+'</div>'+
    '</div>';
  }

  function renderTimeline(){
    const wrap = document.getElementById('timelineWrap');
    const startY = state.birthDate.getFullYear();
    const endY = state.currentYear;
    let html = '<div class="spine"></div>';
    for(let y=startY; y<=endY; y++){
      html += renderYearBlock(y);
    }
    wrap.innerHTML = html;
  }

  /* 生年に応じた「あなたが生きた時代」総括文をルールベースで組み立てる（AI呼び出しなし） */
  function buildSummary(birth, age, startY, endY){
    const by = birth.getFullYear();
    const frags = [];
    if(by<=1926) frags.push('大正から昭和初期に生まれ、ラジオ放送の始まりなど情報化の芽生えを経験した世代です。');
    else if(by<=1945) frags.push('戦中・戦前に生まれ、戦後復興とともに新しい日本の歩みを見てきた世代です。');
    else if(by<=1959) frags.push('戦後復興期に生まれ、高度経済成長とテレビ・新幹線が生活を大きく変えていく時代を体験した世代です。');
    else if(by<=1969) frags.push('高度経済成長期に生まれ、東京オリンピックや宇宙開発競争に世界が沸く時代を体験した世代です。');
    else if(by<=1979) frags.push('安定成長へ向かう時代に生まれ、家庭用ゲーム機など新しい娯楽の登場を経験した世代です。');
    else if(by<=1989) frags.push('バブル経済とその崩壊、そしてパソコンの黎明期を通じて育った世代です。');
    else if(by<=1999) frags.push('冷戦終結後のグローバル化とインターネットの普及を、成長とともに体感してきた世代です。');
    else if(by<=2009) frags.push('携帯電話とインターネットが当たり前の環境に生まれ、スマートフォン登場の衝撃を目の当たりにした世代です。');
    else frags.push('スマートフォンとSNSが生活基盤としてすでに存在し、生成AIの急速な進化を早い時期から経験している世代です。');

    if(startY<=2011 && endY>=2011) frags.push('東日本大震災という、社会全体で防災とエネルギーのあり方を見つめ直す大きな転換点も経てきました。');
    if(startY<=2020 && endY>=2020) frags.push('新型コロナウイルスのパンデミックという、社会の仕組みそのものを問い直す出来事も経験しました。');
    if(startY<=2023 && endY>=2023) frags.push('生成AIが世界的に普及し始めた転換期を、リアルタイムで目撃してきた世代でもあります。');
    frags.push('この'+age+'年の間、科学・医療・宇宙開発・情報技術は目覚ましい進化を遂げ、あなたの人生の歩みはその歴史と確かに重なっています。');
    frags.push('これからも時代は変わり続けますが、あなたが刻んできた時間は、これからを生きる誰かにとっても意味のある記録になるはずです。');
    document.getElementById('summaryText').textContent = frags.join('');
  }

  function refreshFilterOptions(){
    const catSel = document.getElementById('categoryFilter');
    const cats = new Set();
    Object.values(state.years).forEach(function(d){
      d.jp.concat(d.world).forEach(function(ev){ cats.add(ev.category); });
    });
    let catHtml = '<option value="">すべてのカテゴリ</option>';
    cats.forEach(function(c){ catHtml += '<option value="'+c+'">'+(CATEGORY_ICONS[c]||'')+' '+c+'</option>'; });
    catSel.innerHTML = catHtml;

    const jump = document.getElementById('jumpYear');
    const startY = state.birthDate.getFullYear();
    let opts = '<option value="">年代へジャンプ</option>';
    for(let y=startY; y<=state.currentYear; y++) opts += '<option value="'+y+'">'+y+'年（'+ageInYear(y)+'歳）</option>';
    jump.innerHTML = opts;
  }

  function pickRandomCategoryItems(raw){
    const categories = [];
    (raw.jp||[]).forEach(function(e){ if(categories.indexOf(e.category)===-1) categories.push(e.category); });
    (raw.world||[]).forEach(function(e){ if(categories.indexOf(e.category)===-1) categories.push(e.category); });
    if(categories.length===0) return { jp: [], world: [] };
    const picked = categories[Math.floor(Math.random()*categories.length)];
    return {
      jp: (raw.jp||[]).filter(function(e){ return e.category===picked; }),
      world: (raw.world||[]).filter(function(e){ return e.category===picked; })
    };
  }

  function showTimelineFor(birth){
    state.birthDate = birth;
    state.years = {};

    const startY = birth.getFullYear();
    const endY = state.currentYear;
    for(let y=startY; y<=endY; y++){
      if(TIMELINE_DATA && TIMELINE_DATA[y]){
        const raw = TIMELINE_DATA[y];
        const picked = pickRandomCategoryItems(raw);
        state.years[y] = {
          year: y,
          jp: picked.jp,
          world: picked.world,
          aiComment: raw.aiComment || '',
          stars: raw.stars || 3,
          starReason: raw.starReason || ''
        };
      }
    }

    document.getElementById('hero').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    updateStats();
    renderTimeline();
    refreshFilterOptions();
    buildSummary(birth, endY-startY, startY, endY);
    document.getElementById('summarySection').classList.remove('hidden');
  }

  const SAVED_BIRTHDATE_KEY = 'lifeEarthTimeline_birthdate';

  document.getElementById('birthForm').addEventListener('submit', function(e){
    e.preventDefault();
    const val = document.getElementById('birthdate').value;
    if(!val) return;
    const birth = new Date(val+'T00:00:00');
    if(birth > new Date()){ alert('未来の日付は選択できません。'); return; }

    try{
      localStorage.setItem(SAVED_BIRTHDATE_KEY, val);
    }catch(e){ /* localStorageが使えない環境では保存をスキップ */ }

    showTimelineFor(birth);
  });

  (function restoreSavedBirthdate(){
    try{
      const savedVal = localStorage.getItem(SAVED_BIRTHDATE_KEY);
      if(savedVal){
        document.getElementById('birthdate').value = savedVal;
        const birth = new Date(savedVal+'T00:00:00');
        if(!isNaN(birth.getTime()) && birth <= new Date()){
          showTimelineFor(birth);
        }
      }
    }catch(e){ /* localStorageが使えない環境では復元をスキップ */ }
  })();

  document.getElementById('searchInput').addEventListener('input', function(e){
    state.search = e.target.value; renderTimeline();
  });
  document.getElementById('categoryFilter').addEventListener('change', function(e){
    state.category = e.target.value; renderTimeline();
  });
  document.getElementById('regionToggle').addEventListener('click', function(e){
    const btn = e.target.closest('button'); if(!btn) return;
    state.region = btn.dataset.region;
    Array.prototype.forEach.call(document.getElementById('regionToggle').children, function(b){ b.classList.toggle('active', b===btn); });
    renderTimeline();
  });
  document.getElementById('jumpYear').addEventListener('change', function(e){
    if(!e.target.value) return;
    const el = document.getElementById('year-'+e.target.value);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  });
  document.getElementById('themeToggle').addEventListener('click', function(){
    state.theme = state.theme==='light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', state.theme);
    document.getElementById('themeToggle').textContent = state.theme==='light' ? '🌙 ダーク' : '☀️ ライト';
  });
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });
  document.getElementById('restartBtn').addEventListener('click', function(){
    if(confirm('最初の画面に戻ります。よろしいですか？')){
      document.getElementById('app').classList.add('hidden');
      document.getElementById('hero').classList.remove('hidden');
      document.getElementById('generateBtn').disabled = false;
      document.getElementById('generateBtn').textContent = '年表を作成';
    }
  });

  document.getElementById('exportJson').addEventListener('click', function(){
    const blob = new Blob([JSON.stringify({birthDate:state.birthDate, years:state.years}, null, 2)], {type:'application/json'});
    downloadBlob(blob, 'life-timeline.json');
  });
  document.getElementById('exportCsv').addEventListener('click', function(){
    let rows = [['year','age','region','category','title','desc','impact']];
    Object.keys(state.years).sort().forEach(function(y){
      const d = state.years[y];
      d.jp.forEach(function(ev){ rows.push([y, ageInYear(+y), '日本', ev.category, ev.title, ev.desc, ev.impact]); });
      d.world.forEach(function(ev){ rows.push([y, ageInYear(+y), '世界', ev.category, ev.title, ev.desc, ev.impact]); });
    });
    const csv = rows.map(function(r){ return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
    const blob = new Blob(["\uFEFF"+csv], {type:'text/csv'});
    downloadBlob(blob, 'life-timeline.csv');
  });
  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById('saveHistory').addEventListener('click', async function(){
    try{
      const key = 'history:' + state.birthDate.toISOString().slice(0,10);
      await window.storage.set(key, JSON.stringify({birthDate:state.birthDate, years:state.years, savedAt:new Date().toISOString()}));
      alert('この年表を保存しました。');
    }catch(e){ alert('保存に失敗しました: '+e.message); }
  });
  document.getElementById('loadHistory').addEventListener('click', async function(){
    try{
      const list = await window.storage.list('history:');
      if(!list || !list.keys || list.keys.length===0){ alert('保存された年表はまだありません。'); return; }
      const choice = prompt('読み込む生年月日を入力してください:\n' + list.keys.map(function(k){ return k.replace('history:',''); }).join('\n'));
      if(!choice) return;
      const rec = await window.storage.get('history:'+choice);
      if(!rec){ alert('見つかりませんでした。'); return; }
      const parsed = JSON.parse(rec.value);
      state.birthDate = new Date(parsed.birthDate);
      state.years = parsed.years;
      document.getElementById('hero').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      updateStats(); renderTimeline(); refreshFilterOptions();
      document.getElementById('summarySection').classList.add('hidden');
    }catch(e){ alert('読み込みに失敗しました: '+e.message); }
  });

})();
</script>
